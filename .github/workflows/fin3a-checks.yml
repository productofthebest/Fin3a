name: Fin3a checks

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - feat/flutterwave-international-capabilities
      - feat/flutterwave-webhook-security

permissions:
  contents: read

concurrency:
  group: fin3a-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run test suite
        run: bun run test
      - name: Compare full lint against main baseline
        if: always()
        shell: bash
        run: |
          git fetch origin main
          git worktree add /tmp/fin3a-main-baseline origin/main
          ln -s "$GITHUB_WORKSPACE/node_modules" /tmp/fin3a-main-baseline/node_modules
          (cd /tmp/fin3a-main-baseline && bunx eslint . --format json > /tmp/fin3a-main-eslint.json || true)
          bunx eslint . --format json > /tmp/fin3a-branch-eslint.json || true
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const summarize = (file) => {
            const results = JSON.parse(fs.readFileSync(file, "utf8"));
            return results.reduce((total, item) => ({
              errors: total.errors + item.errorCount,
              warnings: total.warnings + item.warningCount,
              filesWithErrors: total.filesWithErrors + (item.errorCount ? 1 : 0),
            }), { errors: 0, warnings: 0, filesWithErrors: 0 });
          };
          const baseline = summarize("/tmp/fin3a-main-eslint.json");
          const branch = summarize("/tmp/fin3a-branch-eslint.json");
          console.log("MAIN_BASELINE_LINT", JSON.stringify(baseline));
          console.log("BRANCH_FULL_LINT", JSON.stringify(branch));
          const delta = {
            errors: branch.errors - baseline.errors,
            warnings: branch.warnings - baseline.warnings,
            filesWithErrors: branch.filesWithErrors - baseline.filesWithErrors,
          };
          console.log("LINT_DELTA", JSON.stringify(delta));
          if (delta.errors > 0 || delta.warnings > 0) {
            console.error("The branch introduces lint findings compared with main.");
            process.exitCode = 1;
          }
          const focus = [
            "src/lib/flutterwave.server.ts",
            "src/lib/bills-pay.server.ts",
            "src/lib/bills-pay.functions.ts",
            "src/lib/flutterwave-bills.test.ts",
            "src/routes/_authenticated/bills.tsx",
          ];
          const mainRows = JSON.parse(fs.readFileSync("/tmp/fin3a-main-eslint.json", "utf8"));
          const branchRows = JSON.parse(fs.readFileSync("/tmp/fin3a-branch-eslint.json", "utf8"));
          let focusIntroduced = 0;
          for (const path of focus) {
            const find = (rows) => rows.find(row => row.filePath.endsWith("/" + path));
            const before = find(mainRows);
            const after = find(branchRows);
            const key = message => `${message.ruleId}::${message.message}::${message.source ?? ""}`;
            const remaining = new Map();
            for (const message of before?.messages ?? []) {
              const value = key(message);
              remaining.set(value, (remaining.get(value) ?? 0) + 1);
            }
            const addedMessages = (after?.messages ?? []).filter(message => {
              const value = key(message);
              const count = remaining.get(value) ?? 0;
              if (count > 0) {
                remaining.set(value, count - 1);
                return false;
              }
              return true;
            }).map(message => ({
              line: message.line,
              column: message.column,
              ruleId: message.ruleId,
              message: message.message,
              source: message.source,
            }));
            focusIntroduced += addedMessages.length;
            console.log("FOCUS_LINT", JSON.stringify({
              path,
              mainErrors: before?.errorCount ?? 0,
              branchErrors: after?.errorCount ?? 0,
              addedMessages,
            }));
          }
          if (focusIntroduced > 0) {
            console.error("Changed payment files introduce lint findings compared with main.");
            process.exitCode = 1;
          }
          NODE
      - name: Lint PR-modified application files (non-format rules)
        if: always()
        run: >-
          bunx eslint
          src/lib/flutterwave.server.ts
          src/lib/bills-pay.server.ts
          src/lib/bills-pay.functions.ts
          src/lib/flutterwave-bills.test.ts
          src/routes/_authenticated/bills.tsx
          --rule 'prettier/prettier: off'
      - name: Build production application
        if: always()
        run: bun run build
