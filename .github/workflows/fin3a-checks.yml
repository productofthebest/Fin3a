name: Fin3a checks

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - feat/flutterwave-international-capabilities

permissions:
  contents: read

concurrency:
  group: fin3a-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run test suite
        run: npm test
      - name: Run ESLint
        run: npm run lint
