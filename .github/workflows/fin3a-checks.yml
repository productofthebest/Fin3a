name: Fin3a checks

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - feat/flutterwave-international-capabilities
      - feat/flutterwave-webhook-security

permissions:
  contents: read

concurrency:
  group: fin3a-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run test suite
        run: bun run test
      - name: Run full repository lint
        run: bun run lint
      - name: Build production application
        run: bun run build
