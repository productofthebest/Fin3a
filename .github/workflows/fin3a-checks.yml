name: Fin3a checks

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - feat/flutterwave-international-capabilities
      - feat/flutterwave-webhook-security

permissions:
  contents: read

# Keep an active validation run alive when another commit is pushed.
# GitHub may queue a newer run, but it must not cancel the current run.
concurrency:
  group: fin3a-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run test suite
        run: bun run test

      - name: Lint integration files
        run: >-
          bunx eslint
          src/lib/flutterwave-capabilities.ts
          src/lib/flutterwave-webhook.server.ts
          src/lib/flutterwave-transaction-verification.server.ts
          src/lib/flutterwave-capabilities.test.ts
          src/lib/fx-quotes.ts
          src/test/fx-quotes.test.ts
          src/test/flutterwave-db.test.ts
          src/components/withdrawal-workspace.tsx
          src/lib/withdrawal-options.ts
          src/lib/withdrawal-options.test.ts
          --rule 'prettier/prettier: off'

      - name: Check withdrawal file formatting
        run: >-
          bunx prettier --check
          src/components/withdrawal-workspace.tsx
          src/lib/withdrawal-options.ts
          src/lib/withdrawal-options.test.ts

      - name: Build production application
        run: bun run build
